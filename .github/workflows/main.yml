name: Direct_To_HuggingFace_Fast
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی ڤیدیۆکە (ئەو لینکەی تۆکنەکەی تێدایە)'
        required: true
      file_name:
        description: 'ناوی فایلەکە لە Hugging Face'
        required: true
        default: 'movie_from_server.mp4'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 -qq
          pip install -q huggingface_hub

      - name: ⬇️ Fast Download
        run: |
          # بەکارهێنانی aria2 بە فێڵەوە بۆ تێپەڕاندنی بلۆک
          aria2c --max-connection-per-server=16 \
                 --split=16 \
                 --min-split-size=1M \
                 --user-agent="Any Tv Pro/2.23 (Android OS)" \
                 --header="Icy-MetaData: 1" \
                 --header="Connection: Keep-Alive" \
                 --header="Accept: */*" \
                 --header="Accept-Encoding: identity" \
                 --retry-wait=5 \
                 -m 10 \
                 -o "video.mp4" "${{ github.event.inputs.video_url }}"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          file_name = '${{ github.event.inputs.file_name }}'
          
          if os.path.exists('video.mp4') and os.path.getsize('video.mp4') > 0:
              print(f'📤 Sending to Hugging Face: {file_name}...')
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done! Check your Hugging Face repo.')
          else:
              print('❌ Error: Download failed or file is empty!')
              exit(1)
          "
