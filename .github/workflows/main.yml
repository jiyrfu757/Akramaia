name: Direct_To_HuggingFace_Fast
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link (Any TV Pro / Seedr)'
        required: true
      file_name:
        description: 'ناوی فایلەکە لەناو Hugging Face'
        required: true
        default: 'video_from_server.mp4'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          # دابەزاندنی yt-dlp کە باشترینە بۆ بڕینی بەربەستی سێرڤەرەکان
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          pip install -q huggingface_hub

      - name: ⬇️ Stealth Download
        run: |
          # بەکارهێنانی فێڵی وێبگەڕ و زیادکردنی Headerەکان بە وردی
          yt-dlp -o "video.mp4" \
            --user-agent "Any Tv Pro/2.23 (Android OS)" \
            --add-header "Icy-MetaData:1" \
            --add-header "Accept-Encoding:identity" \
            --add-header "Connection:Keep-Alive" \
            "${{ github.event.inputs.video_url }}"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          file_name = '${{ github.event.inputs.file_name }}'
          
          if os.path.exists('video.mp4'):
              print(f'📤 Sending to Hugging Face: {file_name}...')
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done! Check your Hugging Face repo.')
          else:
              print('❌ Error: File video.mp4 was not downloaded!')
              exit(1)
          "
