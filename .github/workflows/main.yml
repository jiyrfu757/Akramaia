name: Direct MP4 to HuggingFace

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی ڕاستەوخۆی MP4 لێرە دابنێ'
        required: true
      file_name:
        description: 'ناوێک بۆ فیلمەکە (نموونە: movie.mp4)'
        required: true
        default: 'video_file.mp4'

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update -qq
          pip install -q huggingface_hub

      - name: Download and Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os, subprocess
          from huggingface_hub import HfApi
          
          video_url = '${{ github.event.inputs.video_url }}'
          file_name = '${{ github.event.inputs.file_name }}'
          repo_id = 'Sarkoakram/sarko761'
          
          print(f'📥 دەستکرا بە داگرتنی ڤیدیۆکە...')
          # بەکارهێنانی wget بۆ داگرتنی ڕاستەوخۆ
          res = subprocess.run(['wget', '-q', '--show-progress', '-O', 'temp_video.mp4', video_url])
          
          if res.returncode == 0 and os.path.exists('temp_video.mp4'):
              print(f'📤 ناردن بۆ Hugging Face...')
              api = HfApi()
              api.upload_file(
                  path_or_fileobj='temp_video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=os.getenv('HF_TOKEN')
              )
              print('✅ کارەکە بە سەرکەوتوویی تەواو بوو!')
          else:
              print('❌ هەڵە لە داگرتنی لینکەکەدا هەیە. دڵنیابەرەوە لینکەکە MP4 ڕاستەوخۆیە.')
          "
