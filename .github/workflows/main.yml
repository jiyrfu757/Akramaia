name: Super Fast Torrent Fix

on:
  workflow_dispatch:
    inputs:
      torrent_url:
        description: 'Paste YTS Link Here'
        required: true
      file_name:
        description: 'Output Name (e.g. movie.mp4)'
        required: true
        default: 'video.mp4'

jobs:
  fast_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 -qq
          pip install -q huggingface_hub

      - name: Download & Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os, re, subprocess
          from huggingface_hub import HfApi
          
          # ١. وەرگرتنی هاش (Hash) لە ناو لینکەکە بۆ دروستکردنی مەگنێت
          url = '${{ github.event.inputs.torrent_url }}'
          torrent_hash = url.split('/')[-1]
          magnet = f'magnet:?xt=urn:btih:{torrent_hash}'
          
          print(f'🚀 Starting Turbo Download for Hash: {torrent_hash}')
          
          # ٢. داگرتن بە بەکارهێنانی مەگنێت (بۆ ئەوەی تووشی Error 7 نەبین)
          subprocess.run(['aria2c', '--allow-overwrite=true', '--file-allocation=none', '--seed-time=0', '-x', '16', '-s', '16', magnet])

          # ٣. دۆزینەوەی فایلە گەورەکە و ناردن
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          target = '${{ github.event.inputs.file_name }}'
          
          files = [os.path.join(r, f) for r, d, fs in os.walk('.') for f in fs if f.endswith(('.mp4', '.mkv'))]
          if files:
              video = max(files, key=os.path.getsize)
              print(f'📤 Sending {video} to Hugging Face...')
              api.upload_file(path_or_fileobj=video, path_in_repo=target, repo_id=repo_id, token=os.getenv('HF_TOKEN'))
              print('✅ Done!')
          else:
              print('❌ No video file found. The torrent might be dead.')
          "
