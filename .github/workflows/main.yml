name: Direct_To_HuggingFace_Fast
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی نوێی فیلمەکە'
        required: true
      file_name:
        description: 'ناوی فایلەکە'
        required: true
        default: 'movie_fixed.mp4'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          pip install -q huggingface_hub

      - name: ⬇️ Final Stealth Attempt
        run: |
          # بەکارهێنانی curl بە فۆرماتێکی زۆر پێشکەوتوو
          curl -v -L -k \
            -H "User-Agent: Any Tv Pro/2.23 (Android OS)" \
            -H "Accept: */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Connection: keep-alive" \
            -H "Icy-MetaData: 1" \
            -H "Range: bytes=0-" \
            --retry 5 \
            --retry-delay 2 \
            -o "video.mp4" \
            "${{ github.event.inputs.video_url }}"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          if os.path.exists('video.mp4') and os.path.getsize('video.mp4') > 1024:
              api = HfApi()
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo='${{ github.event.inputs.file_name }}',
                  repo_id='Sarkoakram/sarko761',
                  repo_type='dataset',
                  token=os.getenv('HF_TOKEN')
              )
              print('✅ سەرکەوتوو بوو!')
          else:
              print('❌ شکستی هێنا: سێرڤەرەکە ڕێگەی نەدا فایلەکە دابگیرێت (401/403).')
              exit(1)
          "
