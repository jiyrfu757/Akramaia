name: Turbo Direct Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct MP4 Link'
        required: true
      file_name:
        description: 'File Name (e.g. movie.mp4)'
        required: true
        default: 'video.mp4'

jobs:
  turbo_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install High-Speed Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 -qq
          pip install -q huggingface_hub

      - name: Extreme Speed Download & Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os, subprocess
          from huggingface_hub import HfApi
          
          url = '${{ github.event.inputs.video_url }}'
          name = '${{ github.event.inputs.file_name }}'
          
          print('🚀 Starting Extreme Speed Download...')
          
          # بەکارهێنانی aria2 بە 16 پەیوەندی هاوکات بۆ بەرزترین خێرایی
          # زیادکردنی User-Agent بۆ ئەوەی وەک بڕاوسەر دەربکەوێت
          cmd = [
              'aria2c', 
              '--allow-overwrite=true',
              '-x', '16', 
              '-s', '16', 
              '-k', '1M',
              '--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              '-o', 'fast_video.mp4',
              url
          ]
          
          res = subprocess.run(cmd)
          
          if res.returncode == 0 and os.path.exists('fast_video.mp4'):
              print('📤 Uploading to Hugging Face at server speed...')
              api = HfApi()
              api.upload_file(
                  path_or_fileobj='fast_video.mp4',
                  path_in_repo=name,
                  repo_id='Sarkoakram/sarko761',
                  token=os.getenv('HF_TOKEN')
              )
              print('✅ EVERYTHING DONE IN RECORD TIME!')
          else:
              print('❌ Error: The link from Seedr expired or blocked the server. Please get a fresh link!')
          "
