name: AnyTV_To_HuggingFace
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link (AnyTV)'
        required: true
      file_name:
        description: 'ناوی فایلەکە لەناو Hugging Face'
        required: true
        default: 'anytv_movie.mp4'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 -qq
          pip install -q huggingface_hub

      - name: ⬇️ Fast Download (AnyTV Specific)
        run: |
          # لێرەدا User-Agent مان زیاد کردووە بۆ ئەوەی سێرڤەرەکە نەمانناسێتەوە
          # هەروەها max-connection مان کەم کردووەتەوە بۆ 4 چونکە سێرڤەرە کوردییەکان لە سەروو ئەوەوە بلۆکت دەکەن
          aria2c --user-agent="Any Tv Pro/2.23 (Android OS)" \
                 --max-connection-per-server=4 \
                 --split=4 \
                 -o "video.mp4" "${{ github.event.inputs.video_url }}"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          file_name = '${{ github.event.inputs.file_name }}'
          
          if os.path.exists('video.mp4'):
              print(f'📤 Sending to Hugging Face: {file_name}...')
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done!')
          else:
              print('❌ Download failed, video.mp4 not found.')
              exit(1)
          "
