name: Torrent Download to HuggingFace

on:
  workflow_dispatch:
    inputs:
      torrent_url:
        description: 'لینکی تۆرێنت (YTS Torrent Link)'
        required: true
      file_name:
        description: 'ناوی فایلەکە لەناو HuggingFace (نموونە: movie.mp4)'
        required: true
        default: 'video_from_torrent.mp4'

jobs:
  torrent_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          pip install huggingface_hub

      - name: Download Torrent Content
        run: |
          # ١. داگرتنی خودی فایلی تۆرێنتەکە سەرەتا
          wget -O movie.torrent "${{ github.event.inputs.torrent_url }}"
          
          # ٢. داگرتنی ناوەڕۆکی تۆرێنتەکە بە aria2
          # لێرە کاتی چاوەڕوانی دادەنێین بۆ ئەوەی بوەستێت تا تەواو دەبێت
          aria2c --allow-overwrite=true \
                 --seed-time=0 \
                 --bt-stop-timeout=300 \
                 movie.torrent

      - name: Find and Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          target_name = '${{ github.event.inputs.file_name }}'
          
          # گەڕان بەدوای گەورەترین فایل (فیلمەکە)
          video_file = None
          max_size = 0
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith(('.mp4', '.mkv')):
                      full_path = os.path.join(root, file)
                      size = os.path.getsize(full_path)
                      if size > max_size:
                          max_size = size
                          video_file = full_path
          
          if video_file:
              print(f'Uploading {video_file} as {target_name}...')
              api.upload_file(
                  path_or_fileobj=video_file,
                  path_in_repo=target_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=os.getenv('HF_TOKEN')
              )
              print('✅ Success!')
          else:
              print('❌ No video file found!')
          "
