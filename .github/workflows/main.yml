name: AnyTV_To_HuggingFace_Safe
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی AnyTV'
        required: true
      file_name:
        description: 'ناوی فایلەکە'
        required: true
        default: 'video.mp4'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 -qq
          pip install -q huggingface_hub

      - name: 🌐 Connect Tailscale (Mobile IP)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # لێرە ناوی تابلێتەکەت وەک خۆی نووسراوە
          args: --exit-node=xiaomi-pad-7

      - name: ⬇️ Fast Download
        run: |
          # ئێستا ئێریا تو ئایپی تابلێتەکەت بەکاردێنێت
          aria2c --user-agent="Any Tv Pro/2.23 (Android OS)" \
                 --max-connection-per-server=4 \
                 --split=4 \
                 -o "video.mp4" "${{ github.event.inputs.video_url }}"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          file_name = '${{ github.event.inputs.file_name }}'
          
          if os.path.exists('video.mp4'):
              print(f'📤 Sending to Hugging Face: {file_name}...')
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done!')
          else:
              print('❌ Download failed!')
              exit(1)
          "
